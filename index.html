<style>
/* Layout: iOS-style app shell — large-title screens in a single column, grouped cards, fixed tab bar at the bottom */
:root {
  --bg: #f1f3f1;
  --card: #ffffff;
  --fg: #121614;
  --ink2: #2c3530;
  --muted: #6a736e;
  --line: #e0e5e1;
  --fill: #e9ecea;
  --accent: #0e7f4a;
  --accent-ink: #ffffff;
  --accent-soft: #daefe2;
  --bad: #cf3434;
  --bad-soft: #fbe2df;
  --warn: #a8640a;
  --warn-soft: #fbefd8;
  --bar: rgba(250, 251, 250, 0.86);
  --font-display: "Sora", -apple-system, "SF Pro Display", system-ui, sans-serif;
  --font-body: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --tabh: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e0d; --card: #181b1a; --fg: #eef1ef; --ink2: #d3d9d5; --muted: #8e9792; --line: #282d2b; --fill: #222725;
    --accent: #4cc38a; --accent-ink: #06150d; --accent-soft: #15301f; --bad: #ff7a72; --bad-soft: #3a1b19;
    --warn: #f2b45a; --warn-soft: #382a13; --bar: rgba(20, 23, 22, 0.88); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e0d; --card: #181b1a; --fg: #eef1ef; --ink2: #d3d9d5; --muted: #8e9792; --line: #282d2b; --fill: #222725;
  --accent: #4cc38a; --accent-ink: #06150d; --accent-soft: #15301f; --bad: #ff7a72; --bad-soft: #3a1b19;
  --warn: #f2b45a; --warn-soft: #382a13; --bar: rgba(20, 23, 22, 0.88); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 28px);
}
body.coach { padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 92px); }
#main { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
h2 { font-size: 20px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Headers */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 10px; }
.top > div { min-width: 0; }
.round { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--fill); display: grid; place-items: center; flex: none; }
.round svg { width: 20px; height: 20px; }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 0; }

/* Cards and lists */
.card { background: var(--card); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ghead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.list li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.list .grow b { font-weight: 600; overflow-wrap: anywhere; }
.list small { color: var(--muted); font-size: 13px; }
.x { border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 8px; font-size: 20px; line-height: 1; flex: none; }
.x:hover { background: var(--bad-soft); color: var(--bad); }
.empty { color: var(--muted); font-size: 14.5px; }

.banner { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--accent-soft); color: var(--fg); border: 0; border-radius: 14px; padding: 12px 14px; text-align: left; width: 100%; }
.banner b { color: var(--accent); white-space: nowrap; }
.banner.warn { background: var(--warn-soft); }
.banner.warn b { color: var(--warn); }

/* Stats */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--card); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--font-display); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat[data-tone="good"] .v { color: var(--accent); }
.stat[data-tone="bad"] .v { color: var(--bad); }
.stat .l { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.stat .s { font-size: 12.5px; color: var(--muted); }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-body); font-size: 11px; fill: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.brow { display: grid; grid-template-columns: minmax(0, 1fr) auto 40px; gap: 10px; align-items: center; font-size: 14.5px; }
.brow .track { grid-column: 1 / -1; height: 6px; background: var(--fill); border-radius: 999px; overflow: hidden; margin-top: -4px; }
.brow .track i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.brow .pct { color: var(--muted); text-align: right; font-size: 13px; }

/* Segmented + chips */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 10px; padding: 2px; gap: 2px; }

  else {

    h += `<div class="bars">${cats.map(([c, v]) => `<div class="brow"><span>${esc(EXP_CATS[c] || c)}</span><b class="num">${money(v)}</b><span class="pct num">${Math.round(v / t.spent * 100)}%</span><div class="track"><i style="width:${(v / max * 100).toFixed(1)}%"></i></div></div>`).join("")}</div>

  // tasks
  h += `<section class="card"><div class="ghead"><h2>Tasks</h2><button class="link" data-act="tab" data-arg="tasks">All tasks</button></div>
    <div class="row"><span class="chip">${openT.length} open</span>${overdue.length ? `<span class="chip" style="color:var(--bad)">${overdue.length} overdue</span>` : ""}</div>
    ${dueSoon.length ? `<ul class="list">${dueSoon.map(taskRow).join("")}</ul>` : `<p class="empty">No open tasks.</p>`}</section>`;

}
function stat(l, v, s, tone) { return `<div class="stat" data-tone="${tone}"><span class="l">${esc(l)}</span><span class="v">${v}</span><span class="s">${esc(s)}</span></div>`; }
function dayChart(byDay, cap, todayIdx) {
  const W = 320, H = 170, top = 14, bottom = 22, left = 4, right = 4;
  const maxV = Math.max(...byDay, cap || 0, 1) * 1.12;
  const ch = H - top - bottom, bw = (W - left - right) / 7;
  const y = (v) => top + ch - (v / maxV) * ch;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending per day this week">`;
  s += `<line x1="${left}" x2="${W - right}" y1="${top + ch}" y2="${top + ch}" stroke="var(--line)" />`;
  byDay.forEach((v, i) => {
    const x = left + i * bw + bw * 0.2, w = bw * 0.6, yy = y(v), hgt = top + ch - yy;
    const over = cap && v > cap;
    const fill = v ? (over ? "var(--bad)" : "var(--accent)") : "var(--fill)";
    s += `<rect x="${x.toFixed(1)}" y="${(v ? yy : top + ch - 3).toFixed(1)}" width="${w.toFixed(1)}" height="${(v ? hgt : 3).toFixed(1)}" rx="4" fill="${fill}" />`;
    if (v) s += `<text x="${(x + w / 2).toFixed(1)}" y="${(yy - 4).toFixed(1)}" text-anchor="middle">${esc(Math.round(v))}</text>`;
    s += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" style="${i === todayIdx ? "fill:var(--fg);font-weight:700" : ""}">${DAYS[i]}</text>`;
  });
  if (cap) s += `<line x1="${left}" x2="${W - right}" y1="${y(cap).toFixed(1)}" y2="${y(cap).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="4 4" /><text x="${W - right}" y="${(y(cap) - 4).toFixed(1)}" text-anchor="end">cap ${esc(Math.round(cap))}</text>`;
  return s + `</svg>`;
}

const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };
function byDue(a, b) { return (a.dueAt || "9999") < (b.dueAt || "9999") ? -1 : (a.dueAt || "9999") > (b.dueAt || "9999") ? 1 : PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]; }
function taskRow(x) {
  const today = todayKey();

    <div class="grow"><b>${esc(x.title)}</b>${dueTxt ? `<span class="due ${!done && x.dueAt < today ? "over" : ""}">${!done && x.dueAt < today ? "Overdue · " : ""}${esc(dueTxt)}</span>` : ""}</div>
    <span class="pri" data-p="${x.priority}" title="${x.priority} priority"></span>
    <button class="x" data-act="delTask" data-arg="${x.id}" aria-label="Delete task">×</button></li>`;
}

function moneyResultHTML(ym) {

const HEALTH_LABEL = { good: "Good with money", ok: "Okay, with room to improve", bad: "Needs attention" };
const EXTRA_RE = /stream|netflix|spotify|disney|videoland|hbo|prime|youtube|gym|sport|fitness|subscri|abonnement|magazine|krant|app|game|playstation|xbox/i;
function moneyHealth(p) {
  const md = moneyDoc(), inc = p.income || 1;
  const costPct = p.costs / inc * 100, spendPct = p.spend / inc * 100, savePct = p.save / inc * 100;
  let score = (savePct >= 20 ? 2 : savePct >= 10 ? 1 : 0) + (costPct <= 50 ? 2 : costPct <= 60 ? 1 : 0) + (spendPct <= 30 ? 2 : spendPct <= 40 ? 1 : 0);
  if (p.short) score = 0;
  const level = score >= 5 ? "good" : score >= 3 ? "ok" : "bad";
  const tips = [];
  if (p.short) {
    const perWeek = Math.ceil(p.short / p.weeks / 5) * 5;
    tips.push(`You're ${money(p.short)} short this month. Lower your spending money by about ${money(perWeek)} a week, or cut a monthly cost.`);
  } else if (savePct < 20) {
    const need = inc * 0.2 - p.save, perWeek = Math.ceil(need / p.weeks / 5) * 5;
    tips.push(`Aim to save at least 20% (${money(inc * 0.2)}). You need ${money(need)} more: for example ${money(perWeek)} less spending money per week.`);
  }
  if (costPct > 50) {
    const top = md.costs.slice().sort((a, b) => b.amount - a.amount)[0];
    tips.push(`Monthly costs take ${Math.round(costPct)}% of your income (aim for 50% or less). ${top ? `Your biggest is ${esc(top.name || "a cost")} at ${money(top.amount)}. ` : ""}Cutting ${money(p.costs - inc * 0.5)} gets you to 50%.`);
  }
  const extras = md.costs.filter((c) => c.amount > 0 && EXTRA_RE.test(c.name || ""));
  if (extras.length && level !== "good") tips.push(`Check your extras: ${extras.map((c) => `${esc(c.name)} ${money(c.amount)}`).join(", ")}. Together that's ${money(sum(extras, (c) => c.amount) * 12)} a year.`);
  if (spendPct > 30) tips.push(`Spending money is ${Math.round(spendPct)}% of your income (aim for 30% or less). Every ${money(10)} less per week adds ${money(10 * p.weeks)} to savings this month.`);
  if (!tips.length) tips.push(`You're in great shape. Set up an automatic transfer of ${money(p.save)} to your savings account on payday, so it happens without thinking.`);
  return { level, costPct, spendPct, savePct, tips: tips.slice(0, 3) };
}
function pieHTML(p) {
  const inc = p.income || 1;
  const costs = Math.min(p.costs, inc), spend = Math.max(0, Math.min(p.spend, inc - costs)), save = p.save;
  const h = moneyHealth(p);
  const parts = [["Monthly payments", costs, "var(--muted)", h.costPct, "goal: max 50%", h.costPct > 50], ["Free to spend", spend, "var(--warn)", h.spendPct, "goal: max 30%", h.spendPct > 30], ["Savings", save, "var(--accent)", h.savePct, "goal: at least 20%", h.savePct < 20]];
  const r = 52, C = 2 * Math.PI * r;
  let off = 0, arcs = "";
  parts.forEach(([, v, color]) => {
    const len = C * Math.max(0, v) / inc;
    if (len > 0.5) arcs += `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
    off += len;
  });
  return `<div class="pie"><svg viewBox="0 0 140 140" role="img" aria-label="Payments ${Math.round(h.costPct)}%, free to spend ${Math.round(h.spendPct)}%, savings ${Math.round(h.savePct)}%">
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--fill)" stroke-width="22"/>${arcs}
      <text x="70" y="70" text-anchor="middle" font-size="24" font-weight="700">${Math.round(h.savePct)}%</text>
      <text x="70" y="88" text-anchor="middle" font-size="11" style="fill:var(--muted)">saved</text></svg>
    <ul class="legend">${parts.map(([l, v, color, pct, aim, off2]) => `<li><span class="dot" style="background:${color}"></span><span>${l}</span><b>${Math.round(pct)}%</b><small class="${off2 ? "off" : ""}">${money(v)} · ${aim}</small></li>`).join("")}</ul></div>`;
}
function healthHTML(p) {
  const h = moneyHealth(p);

// ================================================================ markdown
function md(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[\s(])\*(?!\s)([^*]+?)\*(?=[\s.,;:!?)]|$)/g, "$1<em>$2</em>").replace(/`([^`]+)`/g, "<code>$1</code>");
  let out = "", list = null, para = [], table = [];
  const flushP = () => { if (para.length) { out += `<p>${inline(para.join(" "))}</p>`; para = []; } };
  const flushL = () => { if (list) { out += `<${list.t}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.t}>`; list = null; } };
  const flushT = () => {
    if (table.length) {
      const rows = table.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r)).map((r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
      out += `<div class="tbl"><table>${rows.map((r, i) => `<tr>${r.map((c) => i === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;
      table = [];
    }
  };
  for (const raw of lines) {
    const l = raw.trimEnd();
    let m;
    if (/^\s*\|/.test(l)) { flushP(); flushL(); table.push(l); continue; } else flushT();
    if (!l.trim()) { flushP(); flushL(); continue; }
    if ((m = l.match(/^#{1,6}\s+(.*)/))) { flushP(); flushL(); out += `<h4>${inline(m[1])}</h4>`; continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { flushP(); if (!list || list.t !== "ul") { flushL(); list = { t: "ul", items: [] }; } list.items.push(m[1]); continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { flushP(); if (!list || list.t !== "ol") { flushL(); list = { t: "ol", items: [] }; } list.items.push(m[1]); continue; }
    if (list) { list.items[list.items.length - 1] += " " + l.trim(); continue; }
    para.push(l.trim());
  }
  flushP(); flushL(); flushT();
  return out;
}

// ================================================================ AI runs
async function runInsight() {
  if (!AI || S.insightBusy) return;
  S.insightBusy = true; S.insightErr = ""; render(true);
  const wk = weekOf(todayKey());
  try {
    const { text } = await AI(`${HOUSE_RULES()}\n\nYOUR ROLE: the coach's daily read on the home screen.\nWrite 2-3 short sentences: the single most useful observation about this week so far, then one specific action for today with a money figure attached. No headings, no lists, no greeting.\n\nDATA (JSON):\n${JSON.stringify(snapshot(wk))}`, { cache: false });
    updateWeek(todayKey(), (d) => { d.insight = { date: todayKey(), text: text.trim() }; });
  } catch (e) { S.insightErr = aiError(e); }
  S.insightBusy = false; render(true);
}

async function runPlan(wk, intake) {
  if (!AI || S.planBusy) return;
  S.planBusy = true; S.planErr = "";
  put("plan-" + wk, Object.assign({}, planDoc(wk) || {}, { intake }));
  render(true);
  try {
    const data = Object.assign(snapshot(wk), { intake, week_days: DAYS_FULL.map((d, i) => d + " " + addDays(wk, i)) });
    const out = await AI.json(agentPrompt("monday", data), { cache: false });
    if (!out || !out.game_plan || !out.budget_advice) throw { code: "invalid_json" };
    put("plan-" + wk, { intake, output: out, createdAt: new Date().toISOString() });
    S.planEdit = false;
    toast("Your week is planned");
  } catch (e) { S.planErr = aiError(e); }
  S.planBusy = false; render(true); window.scrollTo(0, 0);
}

async function runReview(wk) {
  if (!AI || S.review) return;
  S.review = { wk, status: {} };
  S.reviewErr = null;
  render(true);
  const data = snapshot(wk);
  const t = weekTotals(wk);
  const one = async (role) => {
    S.review.status[role] = "working"; render(true);
    try {
      const r = await AI.json(agentPrompt(role, data), { cache: false });
      S.review.status[role] = "done"; render(true);
      return r;
    } catch (e) {
      S.review.status[role] = "failed"; render(true);
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "rate_limited")) throw e;
      return null;
    }
  };
  try {
    const [spending, cashflow, time, meal] = await Promise.all(["spending", "cashflow", "time", "meal"].map(one));
    const reports = { spending, cashflow, time, meal };
    if (!spending && !cashflow && !time && !meal) throw { code: "upstream_error" };
    S.review.status.strategist = "working"; render(true);
    const stratData = { week_snapshot: data, specialist_reports: Object.fromEntries(Object.entries(reports).map(([k, v]) => [k, v || "report unavailable"])), next_week_start: addDays(wk, 7) };
    const strategist = await AI.json(agentPrompt("strategist", stratData), { cache: false, modelTier: "complex" });
    if (!strategist || !strategist.narrative) throw { code: "invalid_json" };
    S.review.status.strategist = "done";
    put("review-" + wk, { reports, strategist, totals: { spent: t.spent, hours: t.workHours }, createdAt: new Date().toISOString() });
    S.review = null;
    toast("Review ready");
  } catch (e) {
    S.review.status.strategist = S.review.status.strategist === "working" ? "failed" : S.review.status.strategist;
    const err = aiError(e);
    S.review = null;
    S.reviewErr = { wk, err };
  }
  render(true);
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- coach tools
function expensesInDays(days) {
  const from = addDays(todayKey(), -(Math.max(1, Number(days) || 7) - 1));
  return allExpenses().filter((e) => e.date >= from);
}
const COACH_TOOLS = [
  { name: "spending_by_category", description: "Total spent per category over the last N days (including today). Returns {days, total, by_category}.",
    inputSchema: { type: "object", properties: { days: { type: "integer", description: "How many days back, e.g. 7, 30, 90" } }, required: ["days"] },
    execute: ({ days }) => { const ex = expensesInDays(days); const by = {}; ex.forEach((e) => { by[e.category] = round2((by[e.category] || 0) + e.amount); }); return { days: Number(days), total: round2(sum(ex, (e) => e.amount)), by_category: by }; } },
  { name: "merchant_frequency", description: "How often and how much the user spent at each merchant over the last N days. Returns a list sorted by total.",
    inputSchema: { type: "object", properties: { days: { type: "integer" } }, required: ["days"] },
    execute: ({ days }) => { const m = {}; expensesInDays(days).forEach((e) => { const k = e.merchant || "(no merchant: " + e.category + ")"; m[k] = m[k] || { merchant: k, count: 0, total: 0 }; m[k].count++; m[k].total = round2(m[k].total + e.amount); }); return Object.values(m).sort((a, b) => b.total - a.total).slice(0, 25); } },
  { name: "list_expenses", description: "Individual expenses over the last N days, optionally one category (food_out, groceries, transport, rent, bills, subscriptions, shopping, fun, health, other). Max 80 rows, newest first.",
    inputSchema: { type: "object", properties: { days: { type: "integer" }, category: { type: "string" } }, required: ["days"] },
    execute: ({ days, category }) => expensesInDays(days).filter((e) => !category || e.category === category).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 80).map((e) => ({ date: e.date, amount: e.amount, category: e.category, merchant: e.merchant, necessity: e.necessity })) },
  { name: "budget_status", description: "This week's budget, amount spent, what's left and the daily allowance for the remaining days.",
    execute: () => { const wk = weekOf(todayKey()), t = weekTotals(wk), b = weekBudget(wk), di = dayIdx(todayKey()); return { week_start: wk, weekly_budget: b, spent: t.spent, remaining: b != null ? round2(b - t.spent) : null, days_left_including_today: 7 - di, daily_allowance_left: b != null ? round2((b - t.spent) / (7 - di)) : null, spent_today: round2(t.byDay[di]) }; } },
  { name: "time_breakdown", description: "Hours per activity category and total work hours over the last N days.",
    inputSchema: { type: "object", properties: { days: { type: "integer" } }, required: ["days"] },
    execute: ({ days }) => { const from = addDays(todayKey(), -(Math.max(1, Number(days) || 7) - 1)); const by = {}; allActivities().filter((a) => a.date >= from).forEach((a) => { by[a.category] = round2((by[a.category] || 0) + a.durationMin / 60); }); const work = round2(sum(allWork().filter((w) => w.date >= from), (w) => w.hours)); return { days: Number(days), hours_by_category: by, work_hours_logged: work, hourly_rate: profile().hourlyRate || null }; } },
  { name: "savings_projection", description: "Annualise a recurring amount: give an amount and how often it recurs (day, week or month). Returns weekly, monthly and yearly totals.",
    inputSchema: { type: "object", properties: { amount: { type: "number" }, per: { type: "string", enum: ["day", "week", "month"] } }, required: ["amount", "per"] },
    execute: ({ amount, per }) => { const a = Number(amount) || 0; const yearly = per === "day" ? a * 365 : per === "week" ? a * 52 : a * 12; return { weekly: round2(yearly / 52), monthly: round2(yearly / 12), yearly: round2(yearly) }; } },
  { name: "list_tasks", description: "The user's open tasks with due dates and priority.",
    execute: () => tasks().filter((x) => x.status === "open").sort(byDue).map((x) => ({ title: x.title, due: x.dueAt, priority: x.priority })) },
  { name: "add_task", description: "Add a task to the user's task list. Only when the user asks you to add or remind them of something.",
    inputSchema: { type: "object", properties: { title: { type: "string" }, due: { type: "string", description: "YYYY-MM-DD, optional" } }, required: ["title"] },
    execute: ({ title, due }) => { const t = { id: uid(), title: String(title).slice(0, 200), dueAt: /^\d{4}-\d{2}-\d{2}$/.test(String(due || "")) ? String(due) : null, priority: "medium", status: "open", createdAt: new Date().toISOString() }; setTasks(tasks().concat([t])); toast("Task added: " + t.title); return { added: t.title, due: t.dueAt }; } }
];
const TOOL_NOTES = { spending_by_category: "Checked spending by category", merchant_frequency: "Checked merchants", list_expenses: "Looked through expenses", budget_status: "Checked this week's budget", time_breakdown: "Checked your time", savings_projection: "Ran a savings projection", list_tasks: "Checked your tasks", add_task: "Added a task" };

async function sendChat(q) {
  if (!AI || S.chat.busy) return;
  const msgs = chatMsgs().concat([{ role: "user", content: q, at: new Date().toISOString() }]);
  put("chat", { messages: msgs.slice(-40) });
  S.chat = { busy: true, text: "", notes: [], err: "", ctl: new AbortController() };
  render(true);
  const wk = weekOf(todayKey()), t = weekTotals(wk), p = profile();
  const rules = `${HOUSE_RULES()}

YOUR ROLE: the user's live financial coach in a chat window.
You have tools that query their real logged data. Use them before answering any question about amounts, categories, merchants, budgets, time or tasks — do not estimate from the summary when a tool can give you the exact figure. Use savings_projection for any annualised number.
Answer conversationally and get to the point. Lead with the answer, then the evidence. Keep replies short enough to read on a phone. When the user asks what to do, give them a specific action with a money figure attached. If they ask something outside money and time, just help them; you are their assistant, not only their accountant.

Today is ${DAYS_FULL[dayIdx(todayKey())]} ${todayKey()}. User: ${p.name || "unknown name"}. This month: salary ${monthPlan(curYM()).income || "not entered"}, monthly costs ${monthPlan(curYM()).costs}, spending money ${moneyDoc().allowance}/week, moving ${monthPlan(curYM()).save} to savings. Monthly savings goal: ${p.savingsGoal || "not set"}.
This week so far: spent ${t.spent}, budget ${weekBudget(wk) ?? "not set"}, work hours ${t.workHours}, open tasks ${tasks().filter((x) => x.status === "open").length}.`;
  const turns = [{ role: "user", content: rules }].concat(msgs.slice(-16).map((m) => ({ role: m.role, content: m.content })));
  const tools = COACH_TOOLS.map((tl) => Object.assign({}, tl, { execute: (input, ctx) => { S.chat.notes.push(TOOL_NOTES[tl.name] || tl.name); const n = document.createElement("div"); n.className = "tool-note"; n.textContent = TOOL_NOTES[tl.name]; const st = $("#stream"); if (st) st.before(n); return tl.execute(input || {}, ctx); } }));
  let final = "";
  try {
    const caps = await AI.limits().catch(() => null);
    const opts = { signal: S.chat.ctl.signal, cache: false, onText: ({ text }) => { S.chat.text = text; const st = $("#stream"); if (st) { st.innerHTML = `<div class="md">${md(text)}</div>`; window.scrollTo(0, document.body.scrollHeight); } } };
    if (caps && caps.tools) opts.tools = tools;
    const res = await AI(turns, opts);
    final = res.text;
  } catch (e) {
    final = e && e.text ? e.text : "";
    if (!(e && e.code === "cancelled" && final)) S.chat.err = aiError(e);
  }
  if (final.trim()) put("chat", { messages: chatMsgs().concat([{ role: "assistant", content: final.trim(), at: new Date().toISOString() }]).slice(-40) });
  const err = S.chat.err;
  S.chat = { busy: false, text: "", notes: [], err, ctl: null };
  render(true);
}

// ================================================================ boot
const SCREENS = { today: screenToday, log: screenLog, money: screenMoney, tasks: screenTasks, week: screenWeek, coach: screenCoach };
loadLocal();
render(true);

AI = getKey() ? makeAI() : null;
render(true);
})();
</script>
